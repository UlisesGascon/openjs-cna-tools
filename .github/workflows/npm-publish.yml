name: Publish package to npm

on:
  release:
    types: [created]

concurrency:
  group: "${{ github.workflow }} ✨ ${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm
        run: npm install -g npm@latest

      # npm refuses to publish a prerelease without an explicit dist-tag, so a
      # prerelease would otherwise never be tagged `latest` by accident. Use
      # the prerelease identifier (alpha, beta, rc, ...) as the tag; stable
      # versions go to `latest`.
      - name: Resolve dist-tag
        id: dist_tag
        run: |
          tag="$(node -p "require('./package.json').version.match(/-([0-9A-Za-z]+)/)?.[1] ?? 'latest'")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing with dist-tag: $tag"

      - name: Stage publish to npm
        run: npm stage publish --tag "${{ steps.dist_tag.outputs.tag }}"
